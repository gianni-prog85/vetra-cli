name: release

# Publish @powerhousedao/vetra-cli to npm with trusted publishing: npm trusts
# this workflow for the package and takes the run's OIDC token, so no registry
# secret is stored, and the publish carries provenance. Version bumps and
# dependency updates happen in a prior manual commit; this workflow builds and
# publishes whatever version is committed on the branch it runs from.
#
#   branch     dist-tag   registry
#   next/6.4   dev        registry.npmjs.org
#
# npm can only trust a workflow for a package that exists: the first publish
# is manual, the trust is configured on npmjs.com after it, and only then does
# this workflow publish. A trusted workflow can publish but not move dist-tags,
# so a tag beyond the branch's is set by hand (`npm dist-tag add`).

on:
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token npm exchanges for the publish.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: https://registry.npmjs.org

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dist-tag from branch
        id: meta
        run: |
          case "$GITHUB_REF" in
            refs/heads/next/6.4) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release runs from next/6.4 only (got $GITHUB_REF)"; exit 1 ;;
          esac

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: ${{ env.REGISTRY }}

      - name: Check npm can publish with trusted publishing (11.5.1+)
        run: |
          v=$(npm --version)
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$v" \
            || { echo "::error::npm $v predates trusted publishing (needs 11.5.1+)"; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile

      # The package (dist/node, dist/browser, dist/skills), then the Studio SPA
      # (dist/connect). Both need more than the default heap.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build && pnpm build:connect

      # pnpm pack resolves catalog: specifiers into real versions; publishing
      # the directory with npm would ship them unresolved.
      - name: Pack and check the tarball
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/pack"
          mkdir -p "$dest"
          pnpm pack --pack-destination "$dest"
          shopt -s nullglob
          tarballs=("$dest"/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball in $dest, got ${#tarballs[@]}"; exit 1; }
          tgz="${tarballs[0]}"
          if tar -xzO -f "$tgz" package/package.json | grep -E 'catalog:|workspace:|link:'; then
            echo "::error::the tarball has unresolved catalog:/workspace:/link: specs"; exit 1
          fi
          listing=$(tar -tzf "$tgz")
          for f in \
            package/hosts/studio/host.js \
            package/dist/connect/index.html \
            package/dist/skills/agent-profiles/vetra-agent.md \
            package/dist/node/cli/index.mjs; do
            grep -qxF "$f" <<<"$listing" || { echo "::error::the tarball has no $f"; exit 1; }
          done
          echo "TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Publish
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # A rerun of a published version has nothing to do (npm refuses a
          # republish).
          if [ -n "$(npm view "$NAME@$VERSION" version --registry "$REGISTRY" 2>/dev/null || true)" ]; then
            echo "::notice::$NAME@$VERSION is already on $REGISTRY; nothing published"
            exit 0
          fi
          npm publish "$TGZ" --provenance --access public --tag "$TAG" --registry "$REGISTRY"

      # The registry's metadata can lag a publish by minutes.
      - name: Show dist-tags
        run: |
          NAME=$(node -p "require('./package.json').name")
          npm view "$NAME" dist-tags --json --registry "$REGISTRY" || true
