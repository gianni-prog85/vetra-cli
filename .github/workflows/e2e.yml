name: e2e

# The Studio stack from the built package: global-setup boots
# `ph-cli run studio` (switchboard, Connect and the Cli in REPLAY mode) and
# studio-boot.spec.ts opens the Studio drive (cli/e2e/README.md).
on:
  pull_request:
    paths:
      - "cli/**"
      - "editors/**"
      - "document-models/**"
      - "hosts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

# A new push on the same ref cancels the in-progress run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (studio boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The switchboard loads the package from dist/node; Connect serves
      # dist/connect. Both builds need more than the default heap.
      - name: Build the package
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Build the Studio SPA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:connect

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the boot spec
        run: pnpm test:e2e studio-boot

      - name: Dump the boot and service logs on failure
        if: failure()
        run: |
          echo "=== studio.log (tail) ==="
          tail -200 cli/e2e/.cache/studio.log 2>/dev/null || echo "(none)"
          for f in cli/e2e/.cache/service-logs/*; do
            [ -e "$f" ] || continue
            echo "--- $f ---"; tail -150 "$f" 2>/dev/null
          done

      - name: Upload the e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-studio-boot
          path: |
            cli/e2e/playwright-report/
            cli/e2e/.cache/
          # .cache is a dot folder, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
